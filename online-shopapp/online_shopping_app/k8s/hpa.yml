apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: online-shop-hpa
  namespace: online-shop

spec:
  scaleTargetRef:
    kind: Deployment
    apiVersion: apps/v1
    name: online-shop-deployment

  minReplicas: 1
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 2
